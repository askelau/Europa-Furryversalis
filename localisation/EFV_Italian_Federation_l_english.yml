 efv_italian_federation_monarchy_reform:0 "Italian Federal Monarchy"
 efv_italian_federation_monarchy_reform_desc:0 "The Italian princes have bound their realms together under a common defensive constitution while retaining their hereditary crowns."
 efv_italian_federation.20.t:0 "One Italian Federation"
 efv_italian_federation.20.d:0 "Italy can sustain only one federation. Any competing Italian federation has now been dissolved."
 efv_italian_federation.20.a:0 "Understood."