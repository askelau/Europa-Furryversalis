l_english:
 flavor_nov.2.t:0 "The Unification of Russia"
 flavor_nov.2.d:0 "The rival princes have been brought beneath our authority and the old divisions of the Rus' are ending. We may now proclaim a united Russian state, ruled from Novgorod, or preserve the republic's historic identity."
 flavor_nov.2.a:0 "Proclaim the Russian state"
 flavor_nov.2.b:0 "We shall remain Novgorod"