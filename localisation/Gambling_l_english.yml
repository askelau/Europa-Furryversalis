l_english:

InitialGamblingPopup.1.t: "Gambling"
InitialGamblingPopup.1.d: "A gambler will visit your court every 35 years and offer a risky gamble for a valuable resource. You will have the choice to gamble for various randomly selected resources such as ducats, manpower, stability and more. You must be careful however, as the risk might not pay off and there are no returns."
InitialGamblingPopup.1.a: "Understood!"

InitiateGambling.2.t: "A huge gamble"
InitiateGambling.2.d: "A gamble is being initiated, choosing random resource..."
InitiateGambling.2.a: "Understood."

GambleDucats.3.t: "A Ducat Gamble"
GambleDucats.3.d: "A gambler has come to your court, offering you a chance to gain or lose Ducats. Do you take the risk or are you gay (straight if Thorbjørn)?"
GambleDucats.3.a: "Yes, I will take the risk."
GambleDucats.3.b: "No, I will not take the risk."

